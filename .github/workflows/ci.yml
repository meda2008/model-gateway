name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: pyflakes
        run: |
          pip install pyflakes
          python -m pyflakes gateway/ manage_keys.py tests/
      - name: smoke
        run: python tests/smoke.py
